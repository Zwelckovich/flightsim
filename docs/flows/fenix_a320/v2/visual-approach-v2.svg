<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">A320 Visual Approach — spatial simulator training diagram</title><desc id="desc">Downwind right to left, descending base at left, final toward runway at lower right. Configuration sequence: approach phase, Flaps 1, abeam threshold stopwatch, Flaps 2 before base, gear down and spoilers arm turning base, Flaps 3 after gear down, Flaps FULL below VFE, stabilised by 500 ft. Source training values: 1500 ft circuit height, approximately 2.5 NM spacing, 3 seconds per 100 ft plus or minus 1 second per knot of wind component.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#12335b"/></marker><marker id="blue" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#087ee5"/></marker></defs><rect width="1536" height="1024" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif" fill="#102c52"><text x="64" y="57" font-size="14" letter-spacing="3" fill="#007f92" font-weight="700">FENIX A320 · LEARNING PLATE 01</text><text x="64" y="107" font-size="42" font-weight="750">Visual Approach</text><text x="1472" y="92" text-anchor="end" font-size="18" fill="#567080">Configuration, timing &amp; flight path</text><path d="M64 127H1472" stroke="#dae5eb"/><g stroke="#939fa8" stroke-width="3" fill="none" stroke-dasharray="11 9"><path d="M1450 485H400C265 485 165 535 205 655C250 795 405 842 1110 830"/><path d="M755 350V485" stroke-width="2" stroke-dasharray="5 7"/></g><path d="M1450 350H400C285 350 220 380 235 500C245 580 300 630 365 665L1110 830" fill="none" stroke="#087ee5" stroke-width="5" stroke-linecap="round"/><g stroke="#087ee5" stroke-width="5" marker-end="url(#blue)"><path d="M1230 350h-45"/><path d="M935 350h-45"/><path d="M650 350h-45"/><path d="M238 416l-4 22"/><path d="M267 586l19 27"/><path d="M468 688l40 9"/><path d="M837 770l40 9"/></g><g stroke="#12335b" stroke-width="1.6" fill="none"><path d="M400 192H755" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M400 179V209M755 179V209"/><path d="M1330 354V481" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M1318 350h24M1318 485h24"/><path d="M764 494L1097 817" marker-start="url(#arrow)" marker-end="url(#arrow)" stroke-dasharray="6 6"/></g><text x="577" y="170" text-anchor="middle" font-size="21" font-weight="700">3 s / 100 ft</text><text x="577" y="222" text-anchor="middle" font-size="17">± 1 s / kt wind component</text><text x="1348" y="425" font-size="23" font-weight="700">1500 ft</text><rect x="965" y="624" width="130" height="35" rx="4" fill="#fff"/><text x="976" y="649" font-size="23" font-weight="700">≈ 2.5 NM</text><path d="M1110 818H1470L1490 862H1130Z" fill="#78868c" stroke="#314956" stroke-width="2"/><g stroke="#fff" stroke-width="2"><path d="M1133 825h50M1135 831h50M1137 837h50M1139 843h50M1141 849h50"/><path d="M1220 840h35m35 0h35m35 0h35m35 0h35" stroke-dasharray="18 14"/></g><g><polyline points="1400,350 1412,321" fill="none" stroke="#264653" stroke-width="2"/><rect x="1247" y="155" width="260" height="166" rx="9" fill="#fff1c8" stroke="#008498" stroke-width="1.5"/><path d="M1256 155 H1498 Q1507 155 1507 164 V193 H1247 V164 Q1247 155 1256 155Z" fill="#007f92"/><text x="1263" y="181" fill="#fff" font-size="20" font-weight="700">Abeam RWY</text><text x="1263" y="222" font-size="20" font-weight="700">APPR phase — ACTIVATE</text><text x="1263" y="249" font-size="20" font-weight="700">Speed — MANAGED</text><text x="1263" y="276" font-size="20" font-weight="700">F/Ds — OFF</text><text x="1263" y="303" font-size="20" font-weight="700">TRK/FPA — SELECT</text></g><g><polyline points="1030,350 1050,324" fill="none" stroke="#264653" stroke-width="2"/><rect x="906" y="239" width="314" height="85" rx="9" fill="#fff1c8" stroke="#008498" stroke-width="1.5"/><path d="M915 239 H1211 Q1220 239 1220 248 V277 H906 V248 Q906 239 915 239Z" fill="#007f92"/><text x="922" y="265" fill="#fff" font-size="20" font-weight="700">At green dot speed or below</text><text x="922" y="306" font-size="20" font-weight="700">FLAPS 1</text></g><g><polyline points="755,350 755,324" fill="none" stroke="#264653" stroke-width="2"/><rect x="650" y="239" width="221" height="85" rx="9" fill="#fff1c8" stroke="#008498" stroke-width="1.5"/><path d="M659 239 H862 Q871 239 871 248 V277 H650 V248 Q650 239 659 239Z" fill="#007f92"/><text x="666" y="265" fill="#fff" font-size="20" font-weight="700">Abeam threshold</text><text x="666" y="306" font-size="20" font-weight="700">START STOPWATCH</text></g><g><polyline points="440,350 457,324" fill="none" stroke="#264653" stroke-width="2"/><rect x="333" y="239" width="266" height="85" rx="9" fill="#fff1c8" stroke="#008498" stroke-width="1.5"/><path d="M342 239 H590 Q599 239 599 248 V277 H333 V248 Q333 239 342 239Z" fill="#007f92"/><text x="349" y="265" fill="#fff" font-size="20" font-weight="700">Before turning base</text><text x="349" y="306" font-size="20" font-weight="700">FLAPS 2</text></g><g><polyline points="337.24,354.08 281,340" fill="none" stroke="#264653" stroke-width="2"/><rect x="50" y="227" width="231" height="112" rx="9" fill="#fff1c8" stroke="#008498" stroke-width="1.5"/><path d="M59 227 H272 Q281 227 281 236 V265 H50 V236 Q50 227 59 227Z" fill="#007f92"/><text x="66" y="253" fill="#fff" font-size="20" font-weight="700">Turning base</text><text x="66" y="294" font-size="20" font-weight="700">L/G DOWN</text><text x="66" y="321" font-size="20" font-weight="700">SPOILERS ARM</text></g><g><polyline points="239.315,523.115 224,520" fill="none" stroke="#264653" stroke-width="2"/><rect x="32" y="485" width="192" height="85" rx="9" fill="#fff1c8" stroke="#008498" stroke-width="1.5"/><path d="M41 485 H215 Q224 485 224 494 V523 H32 V494 Q32 485 41 485Z" fill="#007f92"/><text x="48" y="511" fill="#fff" font-size="20" font-weight="700">When L/G down</text><text x="48" y="552" font-size="20" font-weight="700">FLAPS 3</text></g><g><polyline points="365,665 262,660" fill="none" stroke="#264653" stroke-width="2"/><rect x="57" y="619" width="205" height="85" rx="9" fill="#fff1c8" stroke="#008498" stroke-width="1.5"/><path d="M66 619 H253 Q262 619 262 628 V657 H57 V628 Q57 619 66 619Z" fill="#007f92"/><text x="73" y="645" fill="#fff" font-size="20" font-weight="700">When below VFE</text><text x="73" y="686" font-size="20" font-weight="700">FLAPS FULL</text></g><g><polyline points="610,719.26 645,690" fill="none" stroke="#264653" stroke-width="2"/><rect x="491" y="578" width="300" height="112" rx="9" fill="#fff1c8" stroke="#008498" stroke-width="1.5"/><path d="M500 578 H782 Q791 578 791 587 V616 H491 V587 Q491 578 500 578Z" fill="#007f92"/><text x="507" y="604" fill="#fff" font-size="20" font-weight="700">By 500 ft at the latest</text><text x="507" y="645" font-size="20" font-weight="700">STABILISED</text><text x="507" y="672" font-size="20" font-weight="700">Flaps FULL · target speed</text></g><circle cx="1400" cy="350" r="9" fill="#fff" stroke="#087ee5" stroke-width="4"/><circle cx="1030" cy="350" r="9" fill="#fff" stroke="#087ee5" stroke-width="4"/><circle cx="755" cy="350" r="9" fill="#fff" stroke="#087ee5" stroke-width="4"/><circle cx="440" cy="350" r="9" fill="#fff" stroke="#087ee5" stroke-width="4"/><circle cx="337.24" cy="354.08" r="9" fill="#fff" stroke="#087ee5" stroke-width="4"/><circle cx="239.315" cy="523.115" r="9" fill="#fff" stroke="#087ee5" stroke-width="4"/><circle cx="365" cy="665" r="9" fill="#fff" stroke="#087ee5" stroke-width="4"/><circle cx="610" cy="719.26" r="9" fill="#fff" stroke="#087ee5" stroke-width="4"/><circle cx="755" cy="485" r="5" fill="#fff" stroke="#939fa8" stroke-width="2"/><path d="M64 913H1472" stroke="#dae5eb"/><text x="64" y="946" font-size="16" font-weight="600">Source: Blackbox711 · Visual Approach A320</text><text x="64" y="975" font-size="15" fill="#567080">Visual redesign · Not to scale · For simulation use only</text><path d="M1110 943h60" stroke="#087ee5" stroke-width="4"/><text x="1186" y="949" font-size="16">Flight path</text><path d="M1110 975h60" stroke="#939fa8" stroke-width="3" stroke-dasharray="11 9"/><text x="1186" y="981" font-size="16">Ground projection</text></g></svg>