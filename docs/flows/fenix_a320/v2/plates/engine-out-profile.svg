="441" font-size="20" fill="#123052" font-weight="550" text-anchor="start">Asymmetrie</text><text x="369" y="469" font-size="20" fill="#123052" font-weight="550" text-anchor="start">beherrschen</text><rect x="62" y="550" width="298" height="144" rx="8" fill="#fff1c8" stroke="#007f92"/><path d="M70 550H352Q360 550 360 558V592H62V558Q62 550 70 550Z" fill="#007f92"/><text x="78" y="578" font-size="20" fill="#fff" font-weight="650" text-anchor="start">ECAM / QRH</text><text x="78" y="621" font-size="20" fill="#123052" font-weight="550" text-anchor="start">Passende Fehlerprozedur</text><text x="78" y="649" font-size="20" fill="#123052" font-weight="550" text-anchor="start">Ausführung mit sicherem</text><text x="78" y="677" font-size="20" fill="#123052" font-weight="550" text-anchor="start">Flugweg koordinieren</text><rect x="665" y="402" width="423" height="116" rx="8" fill="#fff3ce" stroke="#007f92"/><path d="M673 402H1080Q1088 402 1088 410V444H665V410Q665 402 673 402Z" fill="#007f92"/><text x="681" y="430" font-size="20" fill="#fff" font-weight="650" text-anchor="start">Übergang zum Beschleunigen</text><text x="681" y="473" font-size="20" fill="#123052" font-weight="550" text-anchor="start">Engine securing, MAX EO ACC und</text><text x="681" y="501" font-size="20" fill="#123052" font-weight="550" text-anchor="start">Schubzeitlimit zusammen anwenden.</text><circle cx="655" cy="550" r="8" fill="#fff" stroke="#087ee5" stroke-width="4"/><circle cx="795" cy="550" r="8" fill="#fff" stroke="#087ee5" stroke-width="4"/><circle cx="940" cy="550" r="8" fill="#fff" stroke="#087ee5" stroke-width="4"/><circle cx="1120" cy="550" r="8" fill="#fff" stroke="#087ee5" stroke-width="4"/><circle cx="1290" cy="483" r="8" fill="#fff" stroke="#087ee5" stroke-width="4"/><polyline points="795,550 752,608" stroke="#526c7c" stroke-width="1.8" fill="none"/><rect x="652" y="608" width="206" height="88" rx="8" fill="#fff1c8" stroke="#007f92"/><path d="M660 608H850Q858 608 858 616V650H652V616Q652 608 660 608Z" fill="#007f92"/><text x="668" y="636" font-size="20" fill="#fff" font-weight="650" text-anchor="start">F speed</text><text x="668" y="679" font-size="20" fill="#123052" font-weight="550" text-anchor="start">FLAPS 1</text><polyline points="940,550 960,608" stroke="#526c7c" stroke-width="1.8" fill="none"/><rect x="880" y="608" width="215" height="88" rx="8" fill="#fff1c8" stroke="#007f92"/><path d="M888 608H1087Q1095 608 1095 616V650H880V616Q880 608 888 608Z" fill="#007f92"/><text x="896" y="636" font-size="20" fill="#fff" font-weight="650" text-anchor="start">S speed</text><text x="896" y="679" font-size="20" fill="#123052" font-weight="550" text-anchor="start">FLAPS 0</text><polyline points="1240,503 1250,600" stroke="#526c7c" stroke-width="1.8" fill="none"/><rect x="1150" y="600" width="330" height="116" rx="8" fill="#fff1c8" stroke="#007f92"/><path d="M1158 600H1472Q1480 600 1480 608V642H1150V608Q1150 600 1158 600Z" fill="#007f92"/><text x="1166" y="628" font-size="20" fill="#fff" font-weight="650" text-anchor="start">Green dot / weiterer Steigflug</text><text x="1166" y="671" font-size="20" fill="#123052" font-weight="550" text-anchor="start">Routing / Freigabe</text><text x="1166" y="699" font-size="20" fill="#123052" font-weight="550" text-anchor="start">MCT gemäß Verfahren</text><rect x="56" y="837" width="1424" height="109" rx="10" fill="#f1f7fa" stroke="#d9e4ea"/><text x="76" y="870" font-size="21" fill="#007f92" font-weight="700" text-anchor="start">Quellenkonflikt bleibt sichtbar</text><text x="76" y="899" font-size="17" fill="#526c7c" font-weight="400" text-anchor="start">Keine pauschale Warteanweisung „erst nach secured“ und kein universelles 10-Minuten-Limit.</text><text x="76" y="922" font-size="17" fill="#526c7c" font-weight="400" text-anchor="start">Diese Übersicht ersetzt nicht die noch fehlende, passende CFM-Sharklet-Verfahrensquelle.</text><path d="M56 962H1480" fill="none" stroke="#d9e4ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="992" font-size="15" fill="#526c7c" font-weight="400" text-anchor="start">V1 / FSLabs Engine Failure · V2 source review · Airbus Safety First: engine fire / climb speed</text><text x="56" y="1018" font-size="14" fill="#526c7c" font-weight="400" text-anchor="start">Schematic · Not to scale · For simulation use only</text></g></svg>