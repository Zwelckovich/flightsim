<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1080" viewBox="0 0 1536 1080" role="img" aria-labelledby="title desc"><title id="title">Flap Movement Logic</title><desc id="desc">Flap Movement Logic</desc><defs><marker id="arr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto-start-reverse"><path d="M0 0L5 2.5L0 5Z" fill="#087ee5"/></marker><marker id="dim" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#526c7c"/></marker></defs><rect width="1536" height="1080" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif"><text x="56" y="47" font-size="14" fill="#007f92" font-weight="700" text-anchor="start">FENIX A320 · VISUAL LEARNING</text><text x="56" y="99" font-size="42" fill="#123052" font-weight="750" text-anchor="start">Flap Movement Logic</text><text x="56" y="131" font-size="18" fill="#526c7c" font-weight="400" text-anchor="start">Befehle des Piloten und automatische Übergänge getrennt und lesbar.</text><path d="M56 152H1480" fill="none" stroke="#d9e4ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="180" width="1424" height="100" rx="10" fill="#f1f7fa" stroke="#d9e4ea"/><text x="76" y="213" font-size="21" fill="#007f92" font-weight="700" text-anchor="start">Hebelstellung 1 kann zwei Oberflächenkonfigurationen bedeuten</text><text x="76" y="242" font-size="17" fill="#526c7c" font-weight="400" text-anchor="start">CONF 1: Slats ausgefahren · CONF 1+F: Slats und Flaps ausgefahren. Hebel und Oberflächen getrennt betrachten.</text><rect x="58" y="344" width="314" height="116" rx="8" fill="#edf5f7" stroke="#007f92"/><path d="M66 344H364Q372 344 372 352V386H58V352Q58 344 66 344Z" fill="#007f92"/><text x="74" y="372" font-size="20" fill="#fff" font-weight="650" text-anchor="start">Hebel 0 → 1</text><text x="74" y="415" font-size="20" fill="#123052" font-weight="550" text-anchor="start">CAS ≤ 100 kt → 1+F</text><text x="74" y="443" font-size="20" fill="#123052" font-weight="550" text-anchor="start">CAS &gt; 100 kt → 1</text><rect x="1160" y="344" width="314" height="116" rx="8" fill="#edf5f7" stroke="#007f92"/><path d="M1168 344H1466Q1474 344 1474 352V386H1160V352Q1160 344 1168 344Z" fill="#007f92"/><text x="1176" y="372" font-size="20" fill="#fff" font-weight="650" text-anchor="start">Hebel 2 → 1</text><text x="1176" y="415" font-size="20" fill="#123052" font-weight="550" text-anchor="start">CAS &lt; 210 kt → 1+F</text><text x="1176" y="443" font-size="20" fill="#123052" font-weight="550" text-anchor="start">CAS ≥ 210 kt → 1</text><rect x="477" y="345" width="225" height="157" rx="10" fill="#e7f5f0" stroke="#78b39b"/><text x="590" y="407" font-size="47" fill="#19765b" font-weight="750" text-anchor="middle">1+F</text><text x="590" y="448" font-size="18" fill="#19765b" font-weight="650" text-anchor="middle">SLATS + FLAPS</text><rect x="818" y="345" width="225" height="157" rx="10" fill="#e8f2ff" stroke="#83b5dc"/><text x="930" y="407" font-size="47" fill="#087ee5" font-weight="750" text-anchor="middle">1</text><text x="930" y="448" font-size="18" fill="#087ee5" font-weight="650" text-anchor="middle">SLATS</text><path d="M700 378H818" fill="none" stroke="#087ee5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M820 470H702" fill="none" stroke="#087ee5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="760,378 760,567" stroke="#526c7c" stroke-width="1.8" fill="none"/><rect x="480" y="567" width="561" height="116" rx="8" fill="#fff1c8" stroke="#007f92"/><path d="M488 567H1033Q1041 567 1041 575V609H480V575Q480 567 488 567Z" fill="#007f92"/><text x="496" y="595" font-size="20" fill="#fff" font-weight="650" text-anchor="start">Automatisch 1+F → 1</text><text x="496" y="638" font-size="20" fill="#123052" font-weight="550" text-anchor="start">IAS &gt; 210 kt</text><text x="496" y="666" font-size="20" fill="#123052" font-weight="550" text-anchor="start">Flaps fahren ein, Slats bleiben ausgefahren.</text><polyline points="825,470 1104,470 1104,832 1041,832" stroke="#526c7c" stroke-width="1.8" fill="none"/><rect x="480" y="774" width="561" height="116" rx="8" fill="#fff1c8" stroke="#007f92"/><path d="M488 774H1033Q1041 774 1041 782V816H480V782Q480 774 488 774Z" fill="#007f92"/><text x="496" y="802" font-size="20" fill="#fff" font-weight="650" text-anchor="start">Automatisch 1 → 1+F</text><text x="496" y="845" font-size="20" fill="#123052" font-weight="550" text-anchor="start">CAS &lt; 100 kt</text><text x="496" y="873" font-size="20" fill="#123052" font-weight="550" text-anchor="start">Flaps fahren aus.</text><rect x="56" y="548" width="366" height="132" rx="10" fill="#f1f7fa" stroke="#d9e4ea"/><text x="76" y="581" font-size="21" fill="#007f92" font-weight="700" text-anchor="start">Aus der Quellgrafik</text><text x="76" y="610" font-size="17" fill="#526c7c" font-weight="400" text-anchor="start">2 → 1 bei ≥ 210 kt liegt</text><text x="76" y="633" font-size="17" fill="#526c7c" font-weight="400" text-anchor="start">oberhalb des dort genannten</text><text x="76" y="656" font-size="17" fill="#526c7c" font-weight="400" text-anchor="start">CONF-2-VFE von 200 kt.</text><text x="78" y="727" font-size="18" fill="#a63c31" font-weight="600" text-anchor="start">Systemlogik erklären heißt nicht,</text><text x="78" y="753" font-size="18" fill="#a63c31" font-weight="600" text-anchor="start">diese Geschwindigkeit anzufliegen.</text><text x="78" y="779" font-size="18" fill="#a63c31" font-weight="600" text-anchor="start">Grenzwerte gelten unabhängig.</text><rect x="1110" y="640" width="368" height="109" rx="10" fill="#f1f7fa" stroke="#d9e4ea"/><text x="1130" y="673" font-size="21" fill="#007f92" font-weight="700" text-anchor="start">Bei der normalen Retraktion</text><text x="1130" y="702" font-size="17" fill="#526c7c" font-weight="400" text-anchor="start">F speed → Hebel 1</text><text x="1130" y="725" font-size="17" fill="#526c7c" font-weight="400" text-anchor="start">S speed → Hebel 0</text><text x="1128" y="788" font-size="18" fill="#526c7c" font-weight="400" text-anchor="start">Weitere Bedingungen wie</text><text x="1128" y="816" font-size="18" fill="#526c7c" font-weight="400" text-anchor="start">Alpha-/Speed-Lock stehen</text><text x="1128" y="844" font-size="18" fill="#526c7c" font-weight="400" text-anchor="start">in der Referenztabelle.</text><path d="M56 1002H1480" fill="none" stroke="#d9e4ea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="1032" font-size="15" fill="#526c7c" font-weight="400" text-anchor="start">V1 · Flap movement logic / FSLabs reference · thresholds retained as source values</text><text x="56" y="1058" font-size="14" fill="#526c7c" font-weight="400" text-anchor="start">Schematic · Not to scale · For simulation use only</text></g></svg>